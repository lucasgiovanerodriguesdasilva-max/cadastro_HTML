<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Walking Dead</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <form id="cadastroForm">

        <label for="titulo">Título</label>
        <input type="text" id="titulo" required>

        <label for="episodios">Quantidade de episódios</label>
        <input type="number" id="episodios" required>

        <label for="descricao">Descrição</label>
        <input type="text" id="descricao" required>

        <label for="autor">Autor</label>
        <input type="text" id="autor" required>

        <button type="submit">Cadastrar</button>

    </form>


    <!-- Janela que aparece depois do cadastro -->
    <div id="modal">

        <div id="resumo">

            <h2>Cadastro concluído</h2>

            <p><b>Título:</b> <span id="rTitulo"></span></p>

            <p><b>Quantidade de episódios:</b> 
                <span id="rEpisodios"></span>
            </p>

            <p><b>Descrição:</b> 
                <span id="rDescricao"></span>
            </p>

            <p><b>Autor;</b> 
                <span id="rAutor"></span>
            </p>

            <button type="button" id="ok">OK</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
